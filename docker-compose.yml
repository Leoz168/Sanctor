version: '3.8'

services:
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sanctor-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - GO_ENV=production
      - PORT=8080
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    networks:
      - sanctor-network
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sanctor-migrate
    env_file:
      - .env
    environment:
      - GO_ENV=production
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    networks:
      - sanctor-network
    restart: "no"
    command: ["/root/migrate"]

  redis:
    image: redis:7-alpine
    container_name: sanctor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - sanctor-network
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: sanctor-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    networks:
      - sanctor-network
    restart: unless-stopped

networks:
  sanctor-network:
    driver: bridge

volumes:
  redis-data:
